<title>Project Management SRA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior tipo cajetín de plano + vistas operativas (panel, tareas, proyectos, tiempo, equipo) */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E8ECF1; --line:#D3DAE3; --line-2:#C2CBD7;
  --fg:#131A23; --muted:#5A6575; --faint:#8893A3;
  --accent:#2340B0; --accent-fg:#FFFFFF; --accent-soft:#E2E7FA;
  --run:#D99A00; --run-soft:#FCF1D2;
  --ok:#2E7A4C; --ok-soft:#DDEFE3; --warn:#A8690F; --warn-soft:#F8EAD3; --bad:#BF3B28; --bad-soft:#F8DED9;
  --shadow:0 10px 30px rgba(19,26,35,.14);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1217; --surface:#161B22; --surface-2:#1D242D; --line:#29313C; --line-2:#36404D;
  --fg:#E5E9EF; --muted:#97A3B4; --faint:#6C7889;
  --accent:#7E96FF; --accent-fg:#0E1217; --accent-soft:#1D2646;
  --run:#F1B526; --run-soft:#3A2F12;
  --ok:#5BB580; --ok-soft:#173224; --warn:#E3A541; --warn-soft:#3A2B12; --bad:#F06C57; --bad-soft:#3D1C17;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#161B22; --surface-2:#1D242D; --line:#29313C; --line-2:#36404D;
  --fg:#E5E9EF; --muted:#97A3B4; --faint:#6C7889;
  --accent:#7E96FF; --accent-fg:#0E1217; --accent-soft:#1D2646;
  --run:#F1B526; --run-soft:#3A2F12;
  --ok:#5BB580; --ok-soft:#173224; --warn:#E3A541; --warn-soft:#3A2B12; --bad:#F06C57; --bad-soft:#3D1C17;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.top-in.wrap{position:relative}
@media (min-width:1100px){.top-in.wrap{padding-right:calc(max(16px, env(safe-area-inset-right, 0px)) + 100px)}}
.help-btn{position:absolute;top:10px;right:max(16px, env(safe-area-inset-right, 0px));z-index:1;display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700;color:var(--fg);text-decoration:none;background:var(--surface)}
.help-btn:hover{border-color:var(--accent);color:var(--accent)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;line-height:1}
.brand span{font-size:10px;line-height:1.15;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.nav a:hover{color:var(--fg);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--accent)}
.top-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.who select{max-width:150px}

/* jornada (equivalente al reloj de Bitrix) */
.shift{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;background:var(--surface)}
.shift .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.shift[data-st="on"] .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.shift[data-st="pause"] .dot{background:var(--run)}
.shift .t{font-family:var(--f-mono);font-size:12px;min-width:52px}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 11px;font-weight:600;font-size:13px;line-height:1.2}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.run{background:var(--run);border-color:var(--run);color:#1b1400}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 9px;min-width:0}
textarea{resize:vertical;min-height:80px;width:100%}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f > input,label.f > select,label.f > textarea{color:var(--fg);font-weight:400;font-size:14px}

/* ---------- vistas ---------- */
main{padding-block:20px 60px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,42px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
.vh p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel > header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel > header h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.panel .bd{padding:12px 14px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g-2,.g-3{grid-template-columns:minmax(0,1fr)}.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}

.kpi{padding:12px 14px;display:grid;gap:2px;border-left:3px solid var(--line-2);background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 var(--r) var(--r) 0;text-align:left;cursor:pointer}
.kpi:hover{border-right-color:var(--fg)}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi[data-tone="bad"]{border-left-color:var(--bad)} .kpi[data-tone="bad"] .v{color:var(--bad)}
.kpi[data-tone="warn"]{border-left-color:var(--warn)}
.kpi[data-tone="ok"]{border-left-color:var(--ok)}
.kpi[data-tone="acc"]{border-left-color:var(--accent)}
.kpi[data-tone="run"]{border-left-color:var(--run)}

/* barras */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:10px;align-items:center}
.bar-row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.track{height:12px;background:var(--surface-2);border-radius:3px;display:flex;overflow:hidden}
.track i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* pills de estado */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pendiente{color:var(--muted);background:var(--surface-2)}
.st-progreso{color:var(--accent);background:var(--accent-soft)}
.st-revision{color:var(--warn);background:var(--warn-soft)}
.st-completada{color:var(--ok);background:var(--ok-soft)}
.st-aplazada{color:var(--faint);background:var(--surface-2)}
.st-archivada{color:var(--faint);background:transparent;border:1px dashed var(--line-2)}
.late{color:var(--bad);font-weight:700}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--muted);font-weight:600}
.prio{color:var(--bad);font-weight:800;font-size:12px}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.avs{display:flex}.avs .av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}.avs .av:first-child{margin-left:0}
.code{font-family:var(--f-mono);font-size:11px;color:var(--faint)}

/* listas */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.ttl{font-weight:600}
.sub{font-size:12px;color:var(--muted)}

/* filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input[type=search]{flex:1 1 200px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h3{margin:2px 4px 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:6px;cursor:grab;text-align:left}
.card:hover{border-color:var(--line-2);box-shadow:0 2px 0 var(--line)}
.card.drag{opacity:.4}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.card.running{border-color:var(--run);box-shadow:inset 3px 0 0 var(--run)}

/* plazos */
.dl{display:grid;grid-template-columns:repeat(7,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.dl .col h3 .c{font-family:var(--f-mono)}
.dl .col[data-k="atrasado"] h3{color:var(--bad)}
.dl .col[data-k="hoy"] h3{color:var(--warn)}

/* gantt */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.g-in{display:grid;position:relative;width:max-content;min-width:100%}
.g-head,.g-row{display:grid;grid-template-columns:240px var(--tw);}
.g-head{position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.g-name{position:sticky;left:0;background:var(--surface);z-index:1;padding:6px 10px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.g-row{border-bottom:1px solid var(--line);min-height:34px}
.g-row.grp .g-name{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2)}
.g-row.grp .g-track{background:var(--surface-2)}
.g-track{position:relative;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:var(--dw) 100%}
.g-days{display:flex}
.g-days div{width:var(--dw);flex:none;text-align:center;font-size:10px;color:var(--muted);padding:4px 0;font-family:var(--f-mono);border-left:1px solid transparent}
.g-days div.wk{color:var(--fg);font-weight:600}
.g-days div.we{color:var(--faint)}
.g-bar{position:absolute;top:7px;height:20px;border-radius:4px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:600;padding:2px 6px;white-space:nowrap;overflow:hidden;cursor:pointer;border:0;text-align:left}
.g-bar[data-st="completada"]{background:var(--ok);color:#fff}
.g-bar[data-st="revision"]{background:var(--warn);color:#fff}
.g-bar[data-st="pendiente"],.g-bar[data-st="aplazada"]{background:var(--line-2);color:var(--fg)}
.g-bar.late{box-shadow:inset 0 0 0 2px var(--bad)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1;pointer-events:none}
.g-dep{position:absolute;top:16px;height:2px;background:var(--faint);pointer-events:none}

/* proyectos */
.pcard{display:grid;gap:10px;padding:14px;text-align:left;cursor:pointer;border-top:4px solid var(--pc,var(--accent))}
.pcard:hover{border-color:var(--line-2)}
.pcard h3{margin:0;font-size:17px;line-height:1.2}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pc,var(--accent))}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.stats b{color:var(--fg);font-family:var(--f-mono);font-weight:500}

/* tiempo */
.sheet{min-width:720px}
.sheet td.h{text-align:center;font-family:var(--f-mono);font-size:12px}
.sheet td.h .w{font-size:13px;color:var(--fg)}
.sheet td.h .k{font-size:10px;color:var(--muted)}
.sheet td.h.today{background:var(--accent-soft)}
.sheet th.today{color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty b{color:var(--fg);font-size:15px}

/* cajón de tarea */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dr-h .sp{flex:1}
.dr-b{overflow-y:auto;padding:16px;display:grid;gap:14px;align-content:start}
.dr-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.title-in{font-size:20px;font-weight:700;border:0!important;background:transparent!important;padding:4px 0!important;width:100%}
.title-in:focus{outline:none;box-shadow:0 2px 0 var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.box h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:2px 10px 2px 3px;font-size:12px;background:var(--surface);font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .av{width:20px;height:20px;font-size:9px}
.ck{display:flex;gap:8px;align-items:center}
.ck input[type=text]{flex:1}
.ck.done span{text-decoration:line-through;color:var(--muted)}
.logs{display:grid;gap:6px}
.log{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.cm{display:grid;gap:3px;padding:8px 10px;background:var(--surface-2);border-radius:6px}
.cm .who2{font-size:12px;font-weight:700}
.cm .when{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.cm p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.approve{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.approve p{margin:0;flex:1 1 220px}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:500}

/* modal */
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--bg);border-radius:10px;box-shadow:var(--shadow);display:grid}
.modal .dr-b{padding:16px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.notice{border:1px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:var(--r);margin-bottom:14px}
.list{display:grid}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right}
.muted{color:var(--muted)}
/* proyectos */
.sem{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.sem i{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.sem[data-k="verde"] i{background:var(--ok)}.sem[data-k="verde"]{color:var(--ok)}
.sem[data-k="amarillo"] i{background:var(--warn)}.sem[data-k="amarillo"]{color:var(--warn)}
.sem[data-k="rojo"] i{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}.sem[data-k="rojo"]{color:var(--bad)}
.sem[data-k="gris"]{color:var(--faint)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:center}
.kv > span{color:var(--muted)}
.kv > b{font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tline{display:grid;gap:6px}
.tl-axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:150px}
.tl-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;align-items:center}
.tl-n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

const J_INI = [8,20], J_FIN = [17,40];

const atTime = (iso, hm) => { const d = dOf(iso); d.setHours(hm[0], hm[1], 0, 0); return d.getTime(); };
const hc = iso => { const d = new Date(iso); const h = d.getHours(); return `${h % 12 || 12}:${pad(d.getMinutes())}${h >= 12 ? "p" : "a"}`; };

function splitJornada(j, until = Date.now()){
  if (!j || !j.entrada) return { total:0, ord:0, extra:0 };
  const s = new Date(j.entrada).getTime(), e = j.salida ? new Date(j.salida).getTime() : until;
  if (e <= s) return { total:0, ord:0, extra:0 };
  let segs = [[s, e]];
  for (const p of (j.pausas||[])) {
    const ps = new Date(p.desde).getTime(), pe = p.hasta ? new Date(p.hasta).getTime() : e;
    segs = segs.flatMap(([a,b]) => (pe <= a || ps >= b) ? [[a,b]] : [[a, Math.max(a, ps)], [Math.min(b, pe), b]].filter(([x,y]) => y > x));
  }
  const cut = atTime(j.fecha || isoOf(new Date(s)), J_FIN);
  let ord = 0, extra = 0;
  for (const [a,b] of segs) { ord += Math.max(0, Math.min(b, cut) - a); extra += Math.max(0, b - Math.max(a, cut)); }
  return { total: ord + extra, ord, extra };
}

const sstore = { get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} } };
// Cronómetro: parte el tiempo por día y lo registra
function splitByDay(startISO, endMs){
  const out = []; let a = new Date(startISO).getTime();
  while (a < endMs) {
    const d = new Date(a); const next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
    const b = Math.min(endMs, next); out.push({ fecha: isoOf(d), inicio: new Date(a).toISOString(), fin: new Date(b).toISOString(), horas: Math.round((b - a) / 3600000 * 1000) / 1000 }); a = b;
  }
  return out.filter(x => x.horas >= 1/60);
}
async function stopTimer(t, quiet, endMs, nota){
  const since = (t.timers||{})[S.me]; if (!since) return;
  const end = endMs || Date.now();
  const segs = splitByDay(since, end);
  for (const sg of segs) {
    const ok = await w(db => db.collection("registros").add({ tareaId:t.id, proyectoId:t.proyectoId||"", miembroId:S.me, fecha:sg.fecha, inicio:sg.inicio, fin:sg.fin, horas:sg.horas, nota: nota || "Cronómetro", creadoEn:nowISO() }));
    if (!ok) return;
  }
  const tot = segs.reduce((a,x) => a + x.horas, 0);
  if (await w(db => db.collection("tareas").doc(t.id).update({ timers:{ [S.me]: null } })) && !quiet) toast(tot ? `Registrado: ${fmtH(tot)} en ${t.titulo}` : "Cronómetro detenido (menos de 1 min, no se registró)");
}

async function autoCloseTimers(){
  if (autoClosed || !S.db || !S.me) return; autoClosed = true;
  const td = today();
  for (const t of S.raw.tareas) {
    const since = (t.timers||{})[S.me]; if (!since) continue;
    const day = isoOf(new Date(since)); if (day >= td) continue;
    const j = byId(S.jornadas, jId(S.me, day));
    const sMs = new Date(since).getTime();
    let end = j?.salida && new Date(j.salida).getTime() > sMs ? new Date(j.salida).getTime() : Math.min(sMs + 4*3600e3, new Date(dOf(day).getTime() + 24*3600e3 - 60000).getTime());
    await stopTimer(t, true, end, "Cerrado automáticamente (cronómetro olvidado) · revisar");
    toast(`Cerré un cronómetro olvidado en «${t.titulo}». Revisa las horas en Tiempo.`);
  }
}

async function nextNum(db){
  const maxLocal = S.raw.tareas.reduce((m,x) => Math.max(m, x.num||0), 0);
  try {
    const ref = db.doc("contadores/tareas");
    for (let i = 0; i < 4; i++) {
      const r = await ref.acquire({ holder: S.me || "anon", ttlMs: 5000 });
      if (r.acquired) { const snap = await ref.get(); const cur = Math.max(snap.exists ? (+snap.data().ultimo || 0) : 0, maxLocal); await ref.set({ ultimo: cur + 1, en: nowISO() }); return cur + 1; }
      await new Promise(res => setTimeout(res, 350 + Math.random()*400));
    }

function audVal(k, v, t){
  if (!v) return "—";

  if (k === "responsableId" || k === "creadorId") return nameOf(v);
  if (k === "limite" || k === "inicio") return fmtD(v);

/* ================= cálculos ================= */
function monthBounds(){ const d = new Date(); return [isoOf(new Date(d.getFullYear(), d.getMonth(), 1)), isoOf(new Date(d.getFullYear(), d.getMonth()+1, 0))]; }
function eficiencia(mid){
  const [a,b] = monthBounds();
  const mine = S.tareas.filter(t => t.responsableId === mid && t.estado !== "archivada" && t.estado !== "aplazada");
  const rel = mine.filter(t => isLate(t) || (!isDone(t)) || (t.completadaEn && t.completadaEn.slice(0,10) >= a && t.completadaEn.slice(0,10) <= b));
  if (!rel.length) return { pct:100, total:0, prob:0 };
  const prob = rel.filter(t => isLate(t) || (t.estado === "completada" && t.limite && t.completadaEn && t.completadaEn.slice(0,10) > t.limite)).length;
  return { pct: Math.round(100 * (1 - prob/rel.length)), total: rel.length, prob };
}
function horasSemana(mid, wk = weekStart(today())){
  const end = addDays(wk, 6);
  return S.registros.filter(r => (!mid || r.miembroId === mid) && r.fecha >= wk && r.fecha <= end).reduce((a,r) => a + (+r.horas||0), 0);
}
function bucket(t){
  if (t.estado === "completada") return "completadas";
  if (!t.limite) return "sin";
  const td = today();
  if (t.limite < td) return "atrasado";
  if (t.limite === td) return "hoy";
  const ew = addDays(weekStart(td), 6);
  if (t.limite <= ew) return "semana";
  if (t.limite <= addDays(ew, 7)) return "proxima";
  return "luego";
}

/* ================= filtros de tareas ================= */
function filtered(){
  const f = S.f, q = f.q.trim().toLowerCase();
  return S.tareas.filter(t => {
    if (f.estado === "activas" && (isDone(t) || t.estado === "aplazada")) return false;
    if (f.estado === "completadas" && t.estado !== "completada") return false;
    if (f.estado === "archivadas" && t.estado !== "archivada") return false;
    if (f.estado === "todas" && t.estado === "archivada") return false;
    if (["pendiente","progreso","revision","aplazada"].includes(f.estado) && t.estado !== f.estado) return false;
    if ((f.mias ?? !S.admin) && !isMine(t)) return false;
    if (f.panel && taskPanel(t) !== f.panel) return false;
    if (f.etapa && (f.etapa === "_none" ? !!etapaName(t) : etapaName(t) !== f.etapa)) return false;
    if (f.proyecto && (t.proyectoId||"") !== (f.proyecto === "_none" ? "" : f.proyecto)) return false;
    if (f.resp && t.responsableId !== f.resp) return false;
    if (f.rol && S.me) {
      if (f.rol === "resp" && t.responsableId !== S.me) return false;
      if (f.rol === "creo" && t.creadorId !== S.me) return false;
      if (f.rol === "part" && !(t.participantes||[]).includes(S.me)) return false;
      if (f.rol === "obs" && !(t.observadores||[]).includes(S.me)) return false;
    }
    if (q && !(`${t.titulo} ${t.descripcion||""} ${(t.etiquetas||[]).join(" ")} ${code(t)}`.toLowerCase().includes(q))) return false;
    return true;
  });
}

  };
  const rows = people.map(m => {

function tPlazos(list){
  const cols = [["atrasado","Atrasado"],["hoy","Hoy"],["semana","Esta semana"],["proxima","Próxima semana"],["luego","Más adelante"],["sin","Sin fecha límite"],["completadas","Completadas"]];
  const src = S.f.estado === "activas" ? S.tareas.filter(t => t.estado !== "archivada" && passesNonState(t) && (t.estado !== "completada" || (t.completadaEn && t.completadaEn.slice(0,10) >= addDays(today(), -14)))) : list;
  return `<div class="dl">` + cols.map(([k,l]) => { const ts = sortTasks(src.filter(t => bucket(t) === k)); return `<div class="col" data-k="${k}"><h3><span>${l}</span><span class="c">${ts.length}</span></h3>${ts.map(t => cardTask(t, false)).join("") || `<p class="sub" style="margin:4px">—</p>`}</div>`; }).join("") + `</div>`;

function tGantt(list){
  const ts = list.filter(t => t.inicio || t.limite);
  if (!ts.length) return `<section class="panel">${emptyMsg("No hay tareas con fechas", "Asigna fecha de inicio y fecha límite a las tareas para verlas en el cronograma.")}</section>`;
  const td = today();
  const st = t => t.inicio || (t.creadaEn ? t.creadaEn.slice(0,10) : t.limite);
  const en = t => { const s = st(t); const e = t.limite || s; return e < s ? s : e; };
  let a = ts.reduce((m,t) => st(t) < m ? st(t) : m, addDays(td, -7));
  let b = ts.reduce((m,t) => en(t) > m ? en(t) : m, addDays(td, 21));
  a = weekStart(a); if (diffDays(a, b) > 180) b = addDays(a, 180);
  const n = diffDays(a, b) + 1, dw = 30;
  const days = Array.from({length:n}, (_,i) => addDays(a, i));
  const head = days.map(d => { const dd = dOf(d), wd = (dd.getDay()+6)%7; return `<div class="${wd===0?"wk":""} ${wd>4?"we":""} ${festivo(d)?"fe":""}" title="${fmtD(d)}${festivo(d) ? " · Festivo: " + esc(festivo(d)) : ""}">${wd===0 ? `${dd.getDate()} ${MES[dd.getMonth()]}` : dd.getDate()}</div>`; }).join("");
  const groups = {};
  ts.forEach(t => { (groups[t.proyectoId||""] = groups[t.proyectoId||""] || []).push(t); });
  const order = Object.keys(groups).sort((x,y) => (P(x)?.nombre||"~").localeCompare(P(y)?.nombre||"~"));
  const x = d => Math.max(0, Math.min(n, diffDays(a, d))) * dw;
  let rows = "";
  for (const g of order) {
    rows += `<div class="g-row grp"><div class="g-name">${esc(P(g)?.nombre || "Sin proyecto")}</div><div class="g-track"></div></div>`;
    for (const t of groups[g].sort((p,q) => st(p).localeCompare(st(q)))) {
      const left = x(st(t)), width = Math.max(dw, x(en(t)) + dw - left);
      const dep = t.dependeDe && T(t.dependeDe);
      const depLine = dep && (dep.limite || dep.inicio) ? (() => { const dx = x(en(dep)) + dw; return dx < left ? `<span class="g-dep" style="left:${dx}px;width:${left-dx}px" title="Inicia después de ${esc(dep.titulo)}"></span>` : ""; })() : "";
      rows += `<div class="g-row"><div class="g-name" title="${esc(t.titulo)}">${av(t.responsableId)} ${esc(t.titulo)}</div><div class="g-track">${depLine}<button type="button" class="g-bar ${isLate(t)?"late":""}" data-task="${esc(t.id)}" data-st="${esc(t.estado)}" style="left:${left}px;width:${width}px" title="${esc(t.titulo)} · ${fmtD(st(t))} → ${fmtD(en(t))}">${esc(t.titulo)}</button></div></div>`;
    }
  }
  const tl = (td >= a && td <= b) ? `<span class="g-today" style="left:${240 + x(td) + dw/2}px" title="Hoy"></span>` : "";
  return `<div class="legend" style="margin-bottom:8px"><span><i style="background:var(--line-2)"></i>Pendiente</span><span><i style="background:var(--accent)"></i>En progreso</span><span><i style="background:var(--warn)"></i>En revisión</span><span><i style="background:var(--ok)"></i>Completada</span><span><i style="background:var(--bad)"></i>Hoy / vencida</span></div>
  <div class="gantt" style="--dw:${dw}px;--tw:${n*dw}px"><div class="g-in">${tl}<div class="g-head"><div class="g-name sub">Tarea</div><div class="g-days">${head}</div></div>${rows}</div></div>`;
}

/* ---------- PANELES: Proyectos · Obras · Administrativo ---------- */
const PANELES = {
  proyectos:{ n:"Diseños", s:"diseño", nuevo:"+ Nuevo diseño", vacio:"Aún no hay diseños" },
  obras:{ n:"Obras", s:"obra", nuevo:"+ Nueva obra", vacio:"Aún no hay obras" },
  administrativo:{ n:"Administrativo", s:"proyecto administrativo", nuevo:"+ Nuevo proyecto administrativo", vacio:"Aún no hay proyectos administrativos" }
};
const PANEL_KEYS = Object.keys(PANELES);
const panelOf = p => (p && PANELES[p.panel]) ? p.panel : "proyectos";
const panelsOf = m => !m ? [] : Array.isArray(m.paneles) ? m.paneles.filter(k => PANELES[k]) : ["proyectos"];
const memberHasPanel = (m, k) => !!m && (m.rol === "admin" || !!m.ceo || (m.director || []).includes(k) || panelsOf(m).includes(k));
const canPanel = k => S.admin || memberHasPanel(M(S.me), k);
const membersFor = k => activos().filter(m => memberHasPanel(m, k));
S.raw = { proyectos:[], tareas:[], hitos:[], reuniones:[], registros:[], bitacora:[], cambios:[], obra:[], obraPlan:[] };
function applyVisibility(){
  const R = S.raw;
  const vis = new Set(), hid = new Set();
  R.proyectos.forEach(p => (canPanel(panelOf(p)) ? vis : hid).add(p.id));
  const ok = pid => !pid || !hid.has(pid);
  S.proyectos = R.proyectos.filter(p => vis.has(p.id));
  S.tareas = R.tareas.filter(t => t.proyectoId ? !hid.has(t.proyectoId) && (vis.has(t.proyectoId) || canPanel(taskPanelRaw(t))) : (S.admin || isParticipant(t)));
  S.hitos = R.hitos.filter(h => vis.has(h.proyectoId));
  S.reuniones = R.reuniones.filter(r => ok(r.proyectoId));
  const tmap = new Map(R.tareas.map(t => [t.id, t]));
  S.registros = R.registros.filter(r => !r.anulado).map(r => { const tk = tmap.get(r.tareaId); return tk && (tk.proyectoId||"") !== (r.proyectoId||"") ? { ...r, proyectoId: tk.proyectoId || "" } : r; }).filter(r => ok(r.proyectoId));
  S.bitacora = R.bitacora.filter(b => vis.has(b.proyectoId));
  S.cambios = R.cambios.filter(c => vis.has(c.proyectoId));
  S.obra = R.obra.filter(x => vis.has(x.proyectoId));
  S.obraPlan = R.obraPlan.filter(x => vis.has(x.id));
  aplicarFestivos();
}
// Calcula las fechas efectivas (con festivos) sobre copias; lo guardado no se modifica
function aplicarFestivos(){
  const pStart = p => p.inicio || (p.creadoEn || "").slice(0, 10);
  S.proyectos = S.proyectos.map(p0 => {
    const p = { ...p0, etapas: (p0.etapas || []).map(e => ({ ...e })) }, st = pStart(p0), cs = alcOf(p0.id);
    if (p0.fin) { const a = shiftAlc(cs, p0.fin), r = correr(st, a.f); p.finOrig = p0.fin; p.fin = r.f; p.festFin = r.n; p.alcFin = a.n; }
    p.etapas.forEach(e => { if (e.fin) { const a = shiftAlc(cs, e.fin), r = correr(st || e.inicio, a.f); e.finOrig = e.fin; e.fin = r.f; e.festFin = r.n; e.alcFin = a.n; } if (e.inicio) { let ni = shiftAlc(cs, e.inicio).f; if (st && ni > st) { const n = festEntre(st, addDays(ni, -1)); if (n) ni = addWorkDays(addDays(ni, -1), n); } if (ni !== e.inicio) { e.inicioOrig = e.inicio; e.inicio = ni; } } });
    return p;
  });
  const pmap = new Map(S.raw.proyectos.map(p => [p.id, p]));
  S.hitos = S.hitos.map(h0 => {
    if (!h0.fecha) return h0;
    const pr = pmap.get(h0.proyectoId), et = (pr?.etapas || []).find(e => e.id === h0.etapaId);
    const a = shiftAlc(alcOf(h0.proyectoId), h0.fecha), r = correr((pr && pStart(pr)) || et?.inicio || (h0.creadoEn || "").slice(0, 10), a.f);
    return { ...h0, fechaOrig: h0.fecha, fecha: r.f, festExtra: r.n, alcExtra: a.n };
  });
  S.tareas = S.tareas.map(t0 => {
    if (!t0.limite) return t0;
    const r = correr(t0.inicio || (t0.creadaEn || "").slice(0, 10), t0.limite);
    return { ...t0, limiteOrig: t0.limite, limite: r.f, festExtra: r.n };
  });
}

/* ---------- REUNIONES ---------- */
const MEST = { programada:"Programada", realizada:"Realizada", cancelada:"Cancelada" };
const meetState = r => r.estado === "cancelada" ? "cancelada" : r.estado === "realizada" || (r.fecha < today()) || (r.fecha === today() && r.horaFin && r.horaFin <= `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`) ? "realizada" : "programada";
const hm12 = v => { if (!v) return ""; let [h,m] = v.split(":").map(Number); const ap = h >= 12 ? "p. m." : "a. m."; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };

}
function vReuniones(){

  return `<div class="vh"><div><div class="eyebrow">Agenda del equipo</div><h1>Reuniones</h1></div><button class="btn pri" data-newmeet="" type="button">+ Agregar reunión</button></div>
  <div class="filters"><div class="seg" role="group" aria-label="Alcance"><button type="button" data-rm="0" aria-pressed="${!f.todas}">Mis reuniones</button><button type="button" data-rm="1" aria-pressed="${!!f.todas}">Todas</button></div>
    <select id="rf-proy" aria-label="Proyecto"><option value="">Todos los proyectos</option>${S.proyectos.filter(p => p.estado !== "archivado").map(p => `<option value="${esc(p.id)}" ${f.proyecto===p.id?"selected":""}>${esc(p.nombre)}</option>`).join("")}</select></div>
  ${sec("Hoy", hoy, "No hay reuniones hoy")}${sec("Próximas", prox, "No hay reuniones programadas")}${sec("Anteriores", pas, "Sin reuniones anteriores")}`;

function moveHito(h, to){

/* ---------- RESUMEN DEL DÍA (inicio y cierre) ---------- */
const sumKey = k => `sra_sum_${k}_${S.me}_${today()}`;
function markSummary(k){ store.set(sumKey(k), "1"); }
function urgencia(t){
  const td = today();
  if (!t.limite) return { k:5, l:"Sin fecha", c:"" };
  if (t.limite < td) return { k:0, l:`Vencida hace ${diffDays(t.limite, td)} d`, c:"st-devuelto" };
  if (t.limite === td) return { k:1, l:"Vence hoy", c:"st-revision" };
  if (t.limite === addDays(td, 1)) return { k:2, l:"Vence mañana", c:"st-revision" };
  if (t.limite === addWorkDays(td, 1)) return { k:2, l:"Próximo día hábil", c:"st-revision" };
  if (t.limite <= addDays(td, 7)) return { k:3, l:`Vence ${fmtD(t.limite)}`, c:"st-progreso" };
  return { k:4, l:`Vence ${fmtD(t.limite)}`, c:"" };
}

  const hitosHoy = S.hitos.filter(h => h.estado !== "aprobado" && h.fecha && h.fecha <= addDays(td, kind === "inicio" ? 0 : 1) && myProjs.some(p => p.id === h.proyectoId));

    <div class="dr-b"><div><div class="eyebrow">Resumen de inicio · ${fmtD(td)} · jornada ${J_TXT}</div>

  if (r.per === "semana-ant") { const a = addDays(weekStart(td), -7); return [a, addDays(a, 6), "Semana anterior"]; }
  if (r.per === "mes-ant") { const d = new Date(); const a = new Date(d.getFullYear(), d.getMonth()-1, 1), b = new Date(d.getFullYear(), d.getMonth(), 0); return [isoOf(a), isoOf(b), `${MES[a.getMonth()]} ${a.getFullYear()}`]; }
  if (r.per === "rango" && r.desde && r.hasta && r.desde <= r.hasta) return [r.desde, r.hasta, `${fmtD(r.desde)} – ${fmtD(r.hasta)}`];
  const [a, b] = monthBounds(); return [a, b, `${MES[dOf(a).getMonth()]} ${dOf(a).getFullYear()}`];
}
function reportData(){

    const ents = mine.flatMap(t => (t.entregables||[]).filter(e => inR((e.en||"").slice(0,10))));

  });
  const ids = [...new Set([...regs.map(x => x.proyectoId||""), ...tasks.map(t => t.proyectoId||"")])];
  const perProj = ids.map(id => { const ts = tasks.filter(t => (t.proyectoId||"") === id); const ap = S.hitos.filter(h => h.proyectoId === id && h.estado === "aprobado"); return { id, nombre: P(id)?.nombre || "Sin proyecto", panel: P(id) ? PANELES[panelOf(P(id))].n : "", prioridad: NIV[P(id)?.prioridad] || "", riesgo: NIV_R[P(id)?.riesgo] || "", encargado: P(id) ? encNames(P(id)) : "", semaforo: P(id) ? SEM_TXT[salud(P(id)).k] : "", rondas: ap.length ? Math.round(ap.reduce((a,h)=>a+(h.rondas||0),0)/ap.length*10)/10 : null, hitosAprob: ap.length, horas: regs.filter(x => (x.proyectoId||"") === id).reduce((s,x) => s+(+x.horas||0), 0), total: ts.length, completadas: ts.filter(t => t.estado === "completada").length, enPeriodo: ts.filter(t => t.estado === "completada" && inR((t.completadaEn||"").slice(0,10))).length, vencidas: ts.filter(isLate).length }; }).filter(x => x.horas || x.total).sort((x,y) => y.horas - x.horas);

function bindView(){
  const v = $("#view");
  const on = (sel, ev, fn) => { const el = $(sel, v); if (el) el.addEventListener(ev, fn); };
  on("#pf-q", "input", e => { S.pf.q = e.target.value; clearTimeout(bindView.t); bindView.t = setTimeout(() => { render(); requestAnimationFrame(() => { const q = $("#pf-q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }); }, 250); });
  [["pf-enc","enc"],["pf-salud","salud"],["pf-estado","estado"],["pf-prio","prio"],["pf-riesgo","riesgo"]].forEach(([id,k]) => on("#"+id, "change", e => { S.pf[k] = e.target.value; render(); }));
  on("#prf-panel", "change", e => { S.prf.panel = e.target.value; render(); });
  on("#rf-proy", "change", e => { S.rf.proyecto = e.target.value; render(); });
  on("#f-q", "input", e => { S.f.q = e.target.value; clearTimeout(bindView.t); bindView.t = setTimeout(() => { render(); requestAnimationFrame(() => { const q = $("#f-q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }); }, 250); });
  ["proyecto","resp","rol","estado","panel","etapa"].forEach(k => on(`#f-${k}`, "change", e => { S.f[k] = e.target.value; if (k === "panel") { S.f.proyecto = ""; S.f.etapa = ""; } if (k === "proyecto") S.f.etapa = ""; render(); }));
  on("#new-proj", "click", e => openProject(null, e.currentTarget.dataset.panel));
  on("#new-member", "click", () => openMember());
  on("#add-log", "click", () => openLog());
  on("#adm-new-member", "click", () => openMember());
  [["r-per","per"],["r-desde","desde"],["r-hasta","hasta"],["r-persona","persona"],["r-proyecto","proyecto"]].forEach(([id,k]) => on("#"+id, "change", e => { S.rep[k] = e.target.value; if (k === "per" && e.target.value === "rango" && !S.rep.desde) { S.rep.desde = monthBounds()[0]; S.rep.hasta = today(); } render(); }));
  // drag & drop kanban
  v.querySelectorAll(".card[draggable]").forEach(c => {
    c.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", c.dataset.task); c.classList.add("drag"); });
    c.addEventListener("dragend", () => c.classList.remove("drag"));
  });
  v.querySelectorAll(".col[data-col]").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("over"); const t = T(e.dataTransfer.getData("text/plain")); if (t) setEstado(t, col.dataset.col); });
  });
}

async function setEstado(t, est){
  if (t.estado === est) return;
  const needsVal = t.requiereAprobacion !== false;
  if ((est === "completada" || est === "revision") && needsVal && !isVerifier(t)) { openTask(t); toast("Para terminar, entrega con el Link NAS en la sección Entregables."); return; }
  if (t.estado === "revision" && est === "completada" && isVerifier(t)) { await reviewTask(t, true, ""); return; }
  const patch = { estado:est, actualizadaEn:nowISO() };
  if (est === "completada") patch.completadaEn = nowISO(); else patch.completadaEn = null;
  if (patch.estado !== "progreso" && (t.timers||{})[S.me]) await stopTimer(t, true);

}

    else if (isNew) { body.responsableId = d.responsableId || S.me || ""; body.creadorId = d.creadorId || ""; body.requiereAprobacion = true; }
    const needsVal = (body.requiereAprobacion ?? d.requiereAprobacion) !== false;
    if (body.inicio && body.limite && body.limite < body.inicio) { toast("La fecha límite no puede ser anterior al inicio."); return; }
    if (complete) body.estado = "completada";
    if (body.estado === "completada" && needsVal && !S.admin && !(t && isVerifier(t)) && (!t || t.estado !== "completada")) { toast("Esta tarea se cierra con una entrega validada: usa «Entregar» con el Link NAS."); return; }
    if (body.estado === "completada" && (!t || t.estado !== "completada")) body.completadaEn = nowISO();
    if (body.estado !== "completada") body.completadaEn = null;
    let ok;
    if (isNew) {
      ok = await w(async db => { const num = await nextNum(db); await db.collection("tareas").add({ ...body, num, timers:{}, entregables:[], creadaEn:nowISO(), asignadaPor:S.me||"" }); });
    } else {
      if (body.estado !== "progreso" && (t.timers||{})[S.me] && body.estado !== t.estado) await stopTimer(T(t.id), true);
      ok = await w(db => db.collection("tareas").doc(t.id).update(body));
      if (ok) await logChanges(t, body);
    }
    if (ok) { toast(isNew ? (body.responsableId && body.responsableId !== S.me ? `Tarea asignada a ${nameOf(body.responsableId)}.` : "Tarea creada.") : "Cambios guardados."); closeLayer(); }
  }
}

    <div class="seg obtabs" role="group" aria-label="Control de obra" style="margin-bottom:12px;flex-wrap:wrap">${tabs.map(([k, l]) => `<button type="button" data-obtab="${k}" aria-pressed="${tab === k}">${l}${cnt(k)}</button>`).join("")}</div>${inner}</div></section>`;
}

/* ================= rutas ================= */
const VIEWS = ["panel","programacion","proyectos","obras","administrativo","tareas","reuniones","tiempo","equipo","admin"];
document.querySelector(".nav").addEventListener("click", e => { const a = e.target.closest("a[data-v]"); if (a && PANELES[a.dataset.v]) { S.pid = ""; S.pf.q = ""; S.pf.enc = ""; S.pf.salud = ""; render(); } });
function route(){ const h = location.hash.replace("#",""); S.view = VIEWS.includes(h) ? h : "panel"; render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);
S.view = VIEWS.includes(location.hash.replace("#","")) ? location.hash.replace("#","") : "panel";

/* ================= conexión a datos ================= */
(async () => {
  let db = null, user = null;
  try { db = await window.claude?.use?.("db"); } catch(e) { db = null; }
  try { user = await window.claude?.use?.("user"); } catch(e) { user = null; }
  S.db = db;
  try { S.dl = await window.claude?.use?.("downloads"); } catch(e) { S.dl = null; }
  try { S.assets = await window.claude?.use?.("assets"); } catch(e) { S.assets = null; }
  if (user) {
    try { const c = await user.can("data.write"); if (c === false) S.canWrite = false; } catch(e){}
    try { S.canEditArt = !!(await user.canEdit()); } catch(e){}
  }
  loadSession();
  if (db) { try { const c = await db.collection("credenciales").limit(1).get(); S.credsEmpty = c.empty; } catch(e){ S.credsEmpty = false; } }
  if (!db) { S.ready = true; render(); return; }
  const since = addDays(today(), -120);
  const subs = [
    ["miembros", db.collection("miembros")],
    ["proyectos", db.collection("proyectos")],
    ["tareas", db.collection("tareas")],
    ["registros", db.collection("registros").where("fecha", ">=", since)],
    ["jornadas", db.collection("jornadas").where("fecha", ">=", since)],
    ["hitos", db.collection("hitos")],
    ["reuniones", db.collection("reuniones").where("fecha", ">=", since)],
    ["bitacora", db.collection("bitacora")],
    ["cambios", db.collection("cambios")],
    ["obra", db.collection("obra")],
    ["obraPlan", db.collection("obraPlan")],
    ["fotos", db.collection("fotos")],
    ["programaciones", db.collection("programacion").where("semana", ">=", addDays(weekStart(today()), -56))],
  ];
  let pending = subs.length;
  subs.forEach(([k, q]) => {
    let first = true;
    q.onSnapshot(snap => {
      const rows = snap.docs.map(s => ({ id:s.id, ...s.data() }));
      if (k in S.raw) S.raw[k] = rows; else S[k] = rows;
      if (k === "miembros") S.miembros.sort((a,b) => (a.nombre||"").localeCompare(b.nombre||""));
      if (first) { first = false; if (--pending === 0) S.ready = true; }
      if (S.ready) render();
    }, err => { console.error(k, err); if (first) { first = false; if (--pending === 0) S.ready = true; render(); } toast("Se perdió la conexión con parte de los datos. Recarga la página."); });
  });
  try { db.doc("config/respaldo").onSnapshot(sn => { S.respaldo = sn.exists ? sn.data() : null; if (S.ready) render(); }, () => {}); } catch(e){}
  setTimeout(() => { if (!S.ready) { S.ready = true; render(); } }, 8000);
})();
render();
})();
</script>
